name: build

on:
  push:
    branches: [main]
    paths:
      - 'com.usebottles.bottles*'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Two runs would upload identically named assets to the same release tag.
# Serialise them so one cannot clobber the other mid-upload, which would leave
# the tarball and its sha256 out of sync.
# cancel-in-progress: false — a half-finished build is worth keeping; let it
# finish and queue the next one behind it.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest (= 24.04) started hanging indefinitely in apt-get inside
    # "Install build tools" after image 20260816.277 — runs #4 and #5 both stalled
    # on the same command and burned an hour each, while the very same script took
    # seconds on the previous image. 26.04 is still public preview; it is used here
    # only to route around that image. Switch back to ubuntu-latest once 24.04 is
    # fixed.
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The build needs ~15G: sources + SDK + Wine base + build dir. The runner's
      # preinstalled Android/.NET/Haskell toolchains hold on to a dozen or more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h /

      # The distro's flatpak-builder is used only to resolve dependencies — that
      # step does not involve libdir. The build itself goes through
      # org.flatpak.Builder, because the distro package (1.4.2 on noble) does not
      # pass --libdir=lib to meson. Inside the SDK sandbox there is no
      # /etc/debian_version and /usr/lib64 is a real directory, so meson's default
      # logic picks lib64 — the .so files, typelibs and pkgconfig of libportal and
      # vte all land in /app/lib64, off LD_LIBRARY_PATH, and Bottles' terminal and
      # file portal silently break. org.flatpak.Builder is the one Flathub builds
      # with, so it tracks upstream.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder patchelf zstd dbus-daemon
          flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder
          # org.flatpak.Builder needs a session bus; a headless runner has none.
          dbus-run-session -- flatpak run --filesystem=host org.flatpak.Builder --version

      - name: Resolve Bottles version
        id: ver
        run: |
          v=$(sed -n "s/^ *tag: *'\{0,1\}\([0-9.]*\)'\{0,1\} *$/\1/p" \
              com.usebottles.bottles.src.yaml | head -n1)
          [ -n "$v" ] || { echo "cannot parse the Bottles version from src.yaml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Bottles $v"

      - name: Install flatpak dependencies
        run: |
          flatpak-builder --user --install-deps-from=flathub --install-deps-only \
              build com.usebottles.bottles.yml

      - name: Build
        run: |
          dbus-run-session -- flatpak run --filesystem=host org.flatpak.Builder \
              --user --force-clean --disable-rofiles-fuse --ccache=false \
              build com.usebottles.bottles.yml

      # On the FlatPark side this tree is unpacked to /app/extra/bottles rather
      # than /app, so rewrite the RUNPATHs that hardcode /app into $ORIGIN-relative
      # ones. The script verifies its own work and fails on any leftover.
      - name: Relocate RUNPATHs
        run: python3 scripts/relocate.py build/files

      # FlatPark ships no .Debug extension, so 54M of debug symbols would ride
      # along for nobody's benefit. Dropped here rather than by adding
      # no-debuginfo to the manifest, so the fork stays one line away from
      # upstream.
      - name: Drop debug symbols
        run: |
          du -sh build/files/lib/debug || true
          rm -rf build/files/lib/debug

      - name: Emit layout manifest
        run: |
          python3 scripts/layout.py build/files > layout.json
          cat layout.json

      - name: Sanity check
        run: |
          set -e
          for f in bin/wine bin/wineserver bin/bottles bin/bottles-cli \
                   share/wine/wine.inf \
                   share/bottles/bottles.gresource share/bottles/data.gresource; do
            [ -e "build/files/$f" ] || { echo "artifact is missing $f" >&2; exit 1; }
          done
          # These mount points must exist in the tree or the FlatPark shell cannot
          # mount its extensions into them.
          for d in lib/i386-linux-gnu lib/i386-linux-gnu/GL \
                   lib/i386-linux-gnu/codecs-extra; do
            [ -d "build/files/$d" ] || { echo "artifact is missing mount point $d" >&2; exit 1; }
          done
          # Once meson picks lib64 for libdir, the .so files and typelibs of
          # libportal and vte land off LD_LIBRARY_PATH. The app still packages and
          # starts, but its terminal and file portal are broken. That is a silent
          # failure, so stop it here.
          [ ! -d build/files/lib64 ] || {
            echo "artifact contains lib64 — meson picked the wrong libdir:" >&2
            find build/files/lib64 -maxdepth 2 >&2
            exit 1
          }
          for f in lib/libvte-2.91-gtk4.so.0 lib/libportal.so.1 lib/libportal-gtk4.so.1 \
                   lib/girepository-1.0/Vte-3.91.typelib \
                   lib/girepository-1.0/Xdp-1.0.typelib; do
            [ -e "build/files/$f" ] || { echo "artifact is missing $f" >&2; exit 1; }
          done

      - name: Package
        id: pkg
        run: |
          v=${{ steps.ver.outputs.version }}
          name=bottles-$v-x86_64.tar.zst
          tar -I 'zstd -T0 -19' -cf "$name" -C build --transform 's|^files|bottles|' files
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$name")" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          tag="v$v"
          name=${{ steps.pkg.outputs.name }}
          notes=$(printf '%s\n' \
            "Bottles $v, built against the GNOME 50 runtime, for FlatPark to consume as extra-data." \
            "" \
            "- \`$name\` — the whole /app tree, RUNPATHs rewritten to be \$ORIGIN-relative" \
            "- size: ${{ steps.pkg.outputs.size }}" \
            "- \`layout.json\` — the lib/ and share/ subdirectory listing the FlatPark shell checks its symlink lists against" \
            "" \
            "The build recipe is this repository, which satisfies the GPL-3.0 obligation to offer the corresponding source.")
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Bottles $v" --notes "$notes"
          gh release upload "$tag" "$name" "$name.sha256" layout.json --clobber
