name: build

on:
  push:
    branches: [main]
    paths:
      - 'com.usebottles.bottles*'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 两个 run 会往同一个 release tag 上传同名产物,串行化避免互相踩。
# cancel-in-progress: false —— 跑到一半的构建有价值,让它跑完再排下一个。
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest(=24.04)换上 20260816.277 那版镜像后,Install build tools
    # 里的 apt-get 会无限挂起 —— #4 和 #5 都停在同一条命令上,各耗掉一小时,
    # 而同一段脚本在换镜像之前是几十秒的事。26.04 目前还是 public preview,
    # 这里只是用它绕开那版镜像;24.04 修好之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 构建要 ~15G:源码 + SDK + Wine base + build dir。runner 自带的
      # Android/。NET/Haskell 工具链占了十几个 G,先腾出来。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h /

      # 发行版的 flatpak-builder(noble 是 1.4.2)只用来解析依赖 —— 那步不涉及
      # libdir。真正的构建走 org.flatpak.Builder:noble 那个 1.4.2 不给 meson 传
      # --libdir=lib,而 SDK 沙箱里没有 /etc/debian_version、/usr/lib64 又是真目录,
      # 于是 meson 按默认逻辑选 lib64 —— libportal 和 vte 的 .so、typelib、pkgconfig
      # 全落到 /app/lib64,不在 LD_LIBRARY_PATH 上,Bottles 的终端和文件门户直接废。
      # org.flatpak.Builder 是 Flathub 自己构建时用的那份,跟着上游走。
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder patchelf zstd dbus-daemon
          flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder
          dbus-run-session -- flatpak run --filesystem=host org.flatpak.Builder --version

      - name: Resolve Bottles version
        id: ver
        run: |
          v=$(sed -n "s/^ *tag: *'\{0,1\}\([0-9.]*\)'\{0,1\} *$/\1/p" \
              com.usebottles.bottles.src.yaml | head -n1)
          [ -n "$v" ] || { echo "无法从 src.yaml 解析 Bottles 版本" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Bottles $v"

      - name: Install flatpak dependencies
        run: |
          flatpak-builder --user --install-deps-from=flathub --install-deps-only \
              build com.usebottles.bottles.yml

      - name: Build
        run: |
          dbus-run-session -- flatpak run --filesystem=host org.flatpak.Builder \
              --user --force-clean --disable-rofiles-fuse --ccache=false \
              build com.usebottles.bottles.yml

      # 这棵树在 FlatPark 侧会被解到 /app/extra/bottles 而不是 /app,
      # 所以把写死 /app 的 RUNPATH 改成 $ORIGIN 相对。脚本自带复核,残留即失败。
      - name: Relocate RUNPATHs
        run: python3 scripts/relocate.py build/files

      # FlatPark 不发 .Debug 扩展,54M 的调试符号白占负载。在这儿剔掉而不是给
      # manifest 加 no-debuginfo,是为了让 fork 与上游保持一行之差。
      - name: Drop debug symbols
        run: |
          du -sh build/files/lib/debug || true
          rm -rf build/files/lib/debug

      - name: Emit layout manifest
        run: |
          python3 scripts/layout.py build/files > layout.json
          cat layout.json

      - name: Sanity check
        run: |
          set -e
          for f in bin/wine bin/wineserver bin/bottles bin/bottles-cli \
                   share/bottles/bottles.gresource share/bottles/data.gresource; do
            [ -e "build/files/$f" ] || { echo "产物缺少 $f" >&2; exit 1; }
          done
          # 扩展挂载点必须在树里存在,否则 FlatPark 壳挂不上
          for d in lib/i386-linux-gnu lib/i386-linux-gnu/GL \
                   lib/i386-linux-gnu/codecs-extra share/wine/gecko share/wine/mono; do
            [ -d "build/files/$d" ] || { echo "产物缺少挂载点目录 $d" >&2; exit 1; }
          done
          # 扩展挂载点必须在树里存在,否则 FlatPark 壳挂不上
          # meson 的 libdir 一旦选成 lib64,libportal/vte 的 .so 和 typelib 就会
          # 落在 LD_LIBRARY_PATH 之外 —— 应用照样打包成功,但终端和门户是坏的。
          # 这是静默故障,所以在这儿拦死。
          [ ! -d build/files/lib64 ] || {
            echo "产物里出现了 lib64,meson 的 libdir 选错了:" >&2
            find build/files/lib64 -maxdepth 2 >&2
            exit 1
          }
          for f in lib/libvte-2.91-gtk4.so.0 lib/libportal.so.1 lib/libportal-gtk4.so.1 \
                   lib/girepository-1.0/Vte-3.91.typelib \
                   lib/girepository-1.0/Xdp-1.0.typelib; do
            [ -e "build/files/$f" ] || { echo "产物缺少 $f" >&2; exit 1; }
          done

      - name: Package
        id: pkg
        run: |
          v=${{ steps.ver.outputs.version }}
          name=bottles-$v-x86_64.tar.zst
          tar -I 'zstd -T0 -19' -cf "$name" -C build --transform 's|^files|bottles|' files
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$name")" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          tag="v$v"
          name=${{ steps.pkg.outputs.name }}
          notes=$(printf '%s\n' \
            "Bottles $v,对着 GNOME 50 运行时构建,供 FlatPark 以 extra-data 消费。" \
            "" \
            "- \`$name\` — 整棵 /app 树,RUNPATH 已改写为 \$ORIGIN 相对" \
            "- size: ${{ steps.pkg.outputs.size }}" \
            "- \`layout.json\` — lib/ 与 share/ 子目录清单,FlatPark 壳据此校验软链列表" \
            "" \
            "构建配方即本仓库,满足 GPL-3.0 的源码提供义务。")
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Bottles $v" --notes "$notes"
          gh release upload "$tag" "$name" "$name.sha256" layout.json --clobber
